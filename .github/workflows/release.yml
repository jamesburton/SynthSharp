name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (example: 0.1.0)"
        required: true
        default: "0.1.0"
      publish_nuget:
        description: "Publish packages to NuGet"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      publish_nuget: ${{ steps.vars.outputs.publish_nuget }}
    steps:
      - name: Resolve release variables
        id: vars
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
            $publishNuget = "${{ inputs.publish_nuget }}"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart('v')
            $publishNuget = "true"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish_nuget=$publishNuget" >> $env:GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/SynthSharp.Core/SynthSharp.Core.csproj
          dotnet restore src/SynthSharp.Audio/SynthSharp.Audio.csproj
          dotnet restore tests/SynthSharp.Core.Tests/SynthSharp.Core.Tests.csproj
          dotnet restore tests/SynthSharp.Audio.Tests/SynthSharp.Audio.Tests.csproj

      - name: Test core
        run: dotnet test tests/SynthSharp.Core.Tests/SynthSharp.Core.Tests.csproj --configuration Release --no-restore

      - name: Test audio
        run: dotnet test tests/SynthSharp.Audio.Tests/SynthSharp.Audio.Tests.csproj --configuration Release --no-restore

  package-nuget:
    runs-on: ubuntu-latest
    needs: [prepare, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore src/SynthSharp.Core/SynthSharp.Core.csproj
          dotnet restore src/SynthSharp.Audio/SynthSharp.Audio.csproj
          dotnet restore src/SynthSharp.Input/SynthSharp.Input.csproj
          dotnet restore src/SynthSharp.Tool/SynthSharp.Tool.csproj

      - name: Pack NuGet packages
        run: |
          mkdir -p artifacts/nuget
          dotnet pack src/SynthSharp.Core/SynthSharp.Core.csproj -c Release --no-restore -o artifacts/nuget /p:PackageVersion=${{ needs.prepare.outputs.version }}
          dotnet pack src/SynthSharp.Audio/SynthSharp.Audio.csproj -c Release --no-restore -o artifacts/nuget /p:PackageVersion=${{ needs.prepare.outputs.version }}
          dotnet pack src/SynthSharp.Input/SynthSharp.Input.csproj -c Release --no-restore -o artifacts/nuget /p:PackageVersion=${{ needs.prepare.outputs.version }}
          dotnet pack src/SynthSharp.Tool/SynthSharp.Tool.csproj -c Release --no-restore -o artifacts/nuget /p:PackageVersion=${{ needs.prepare.outputs.version }}

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          path: artifacts/nuget/*

  publish-nuget:
    runs-on: ubuntu-latest
    needs: [prepare, package-nuget]
    if: needs.prepare.outputs.publish_nuget == 'true'
    steps:
      - name: Download NuGet artifacts
        uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget

      - name: Ensure NuGet key is configured
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY is not configured."
            exit 1
          fi

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-tool-binaries:
    runs-on: ${{ matrix.os }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: windows-latest
            rid: win-arm64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/SynthSharp.Tool/SynthSharp.Tool.csproj

      - name: Publish tool binary
        run: dotnet publish src/SynthSharp.Tool/SynthSharp.Tool.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:EnableSourceControlManagerQueries=false -o artifacts/tool/${{ matrix.rid }}

      - name: Archive tool binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/tool/${{ matrix.rid }}/*" -DestinationPath "artifacts/tool/SynthSharp.Tool-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Archive tool binary (non-Windows)
        if: matrix.os != 'windows-latest'
        run: tar -czf artifacts/tool/SynthSharp.Tool-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}.tar.gz -C artifacts/tool/${{ matrix.rid }} .

      - name: Upload tool artifact
        uses: actions/upload-artifact@v5
        with:
          name: tool-${{ matrix.rid }}
          path: artifacts/tool/SynthSharp.Tool-${{ needs.prepare.outputs.version }}-${{ matrix.rid }}*

  publish-maui-windows:
    runs-on: windows-latest
    needs: [prepare, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Publish MAUI Windows app
        run: |
          dotnet restore src/SynthSharp.Core/SynthSharp.Core.csproj
          dotnet restore src/SynthSharp.Audio/SynthSharp.Audio.csproj
          dotnet restore src/SynthSharp.Input/SynthSharp.Input.csproj
          dotnet restore src/SynthSharp.App/SynthSharp.App.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -r win-x64
          dotnet restore src/SynthSharp.Core/SynthSharp.Core.csproj
          dotnet restore src/SynthSharp.Audio/SynthSharp.Audio.csproj
          dotnet restore src/SynthSharp.Input/SynthSharp.Input.csproj
          dotnet publish src/SynthSharp.App/SynthSharp.App.csproj -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -p:PublishReadyToRun=false -p:WindowsPackageType=None --no-restore -o artifacts/app/windows

      - name: Archive MAUI app
        shell: pwsh
        run: Compress-Archive -Path "artifacts/app/windows/*" -DestinationPath "artifacts/app/SynthSharp.App-${{ needs.prepare.outputs.version }}-windows.zip"

      - name: Export MAUI portable executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "artifacts/app/windows" -Filter "*.exe" | Where-Object { $_.Name -eq "SynthSharp.App.exe" } | Select-Object -First 1
          if ($null -eq $exe) {
            throw "Could not find SynthSharp.App.exe in publish output."
          }
          Copy-Item $exe.FullName "artifacts/app/SynthSharp.App-${{ needs.prepare.outputs.version }}-windows.exe"

      # TODO(packaging-phase-9): Authenticode signing for MAUI Windows binaries
      # Enable by setting the WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD repository secrets.
      # - name: Sign Windows MAUI binaries
      #   if: env.WINDOWS_CERT_PFX_BASE64 != ''
      #   env:
      #     WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      #     WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      #   shell: pwsh
      #   run: |
      #     $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64)
      #     $cert = "$env:RUNNER_TEMP\codesign.pfx"
      #     [IO.File]::WriteAllBytes($cert, $bytes)
      #     $exes = Get-ChildItem 'artifacts/app/windows' -Filter '*.exe' -Recurse
      #     & signtool sign /f $cert /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /fd SHA256 /td SHA256 $exes.FullName

      - name: Upload MAUI artifact
        uses: actions/upload-artifact@v5
        with:
          name: maui-windows
          path: |
            artifacts/app/SynthSharp.App-${{ needs.prepare.outputs.version }}-windows.zip
            artifacts/app/SynthSharp.App-${{ needs.prepare.outputs.version }}-windows.exe

  smoke-test-tool:
    runs-on: ${{ matrix.os }}
    needs: [prepare, publish-nuget]
    if: needs.prepare.outputs.publish_nuget == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install SynthSharp.Tool (poll for NuGet indexing)
        shell: bash
        run: |
          # NuGet v3 indexing for tool packages can take 5-30 min after push.
          # Poll up to 20 attempts at 30s each (10 min total) before giving up.
          version="${{ needs.prepare.outputs.version }}"
          attempts=20
          for i in $(seq 1 $attempts); do
            echo "Attempt $i/$attempts: installing SynthSharp.Tool $version..."
            if dotnet tool install --global SynthSharp.Tool --version "$version" --add-source https://api.nuget.org/v3/index.json; then
              echo "Installed on attempt $i."
              echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "Not indexed yet; waiting 30s..."
              sleep 30
            fi
          done
          echo "::error::SynthSharp.Tool $version was not installable after $((attempts * 30))s of polling. NuGet indexing may be unusually slow today."
          exit 1

      - name: Run tool to render a tone
        shell: bash
        run: |
          synthsharp tone --wave sine --pitch A4 --duration-ms 100 --out test-tone.wav
          test -f test-tone.wav
          # Validate file size > 1 KB (1024 bytes)
          actual_size=$(wc -c < test-tone.wav)
          if [ "$actual_size" -lt 1024 ]; then
            echo "Generated WAV is too small: $actual_size bytes"
            exit 1
          fi

      - name: Try dnx invocation (Windows only, optional)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          # dnx is available in .NET 10 preview 4+ for tool packages
          dnx SynthSharp.Tool tone --wave sawtooth --pitch C4 --duration-ms 100 --out dnx-tone.wav
          if (-not (Test-Path dnx-tone.wav)) { throw 'dnx invocation did not produce output' }

  release:
    runs-on: ubuntu-latest
    needs: [prepare, test, package-nuget, publish-tool-binaries, publish-maui-windows]
    if: always() && needs.test.result == 'success'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: SynthSharp ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.nupkg
            dist/**/*.exe
